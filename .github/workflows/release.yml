name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build binary and skill assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            version="manual-${GITHUB_RUN_NUMBER}"
          fi
          export VERSION="${version}"
          export COMMIT="${GITHUB_SHA}"
          export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          make release-binaries
          make skills-bundle

          cp dist/checksums.txt dist/binary-checksums.txt
          cp dist/skills/checksums.txt dist/skills-checksums.txt

      - name: Upload release assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc.') || contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/binary-checksums.txt
            dist/cute-pcap-mcp-skills-*.zip
            dist/skills/*.zip
            dist/skills-checksums.txt

